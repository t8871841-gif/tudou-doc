name: jarvis_car
description: "Jarvis 车机轻量版：横屏 HUD，系统语音识别，本地车机指令 + DeepSeek 闲聊，Edge 语音播报。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  audioplayers: ^6.1.0
  crypto: ^3.0.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
