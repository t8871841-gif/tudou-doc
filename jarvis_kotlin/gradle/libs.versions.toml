[versions]
agp = "8.3.1"
coreKtx = "1.12.0"
okhttp = "4.12.0"
kotlin = "1.9.22"
ksp = "1.9.22-1.0.17"
room = "2.6.1"
coroutines = "1.7.3"
mediapipeGenai = "0.10.24"
webkit = "1.9.0"
shizuku = "13.1.5"
mlkitTextRecognition = "16.0.1"
liquidglass = "2.0.11"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeGenai" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
# OCR 补字层（Mika 同款，Bundled 版离线模型，不依赖 Play Services，国行机可用）
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-chinese = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkitTextRecognition" }
# 真液态玻璃第 1 批：QWEA0/Liquid-Glass-Android v2.0.11（MIT，JitPack 坐标；
# 仓库见 settings.gradle）。View 体系、minSdk 24，API 33+ 走 AGSL 透镜管线。
liquidglass = { group = "com.github.QWEA0", name = "liquidglass", version.ref = "liquidglass" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
