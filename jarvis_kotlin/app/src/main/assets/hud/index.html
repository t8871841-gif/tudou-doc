<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S 控制台</title>

<link rel="stylesheet" href="css/hud.css">
</head><body class="dormant">
<canvas id="stage" aria-label="贾维斯核心。点击开始对话，拖动可以旋转。" role="img"></canvas>
<div id="demoQuick" role="group" aria-label="演示快捷指令">
  <button type="button" id="dqShip" class="dq-btn" aria-label="星舰发射"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5c2.6 2.3 3.8 5 3.8 7.8l1.7 3-2.2-.8c-.7 1.5-1.9 2.6-3.3 3-1.4-.4-2.6-1.5-3.3-3l-2.2.8 1.7-3c0-2.8 1.2-5.5 3.8-7.8z"/><circle cx="12" cy="9" r="1.6"/><path d="M10.6 18.2c.3 1.1.8 2 1.4 2.6.6-.6 1.1-1.5 1.4-2.6"/></svg></button>
  <button type="button" id="dqRoadster" class="dq-btn" aria-label="悬停"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.5l1.6-3.6C5 7.8 5.8 7.2 7 7.2h3.6l2.2 2.3h3.7c1.2 0 2.2 1 2.2 2.2v.8H3z"/><circle cx="7.2" cy="14.5" r="1.8"/><circle cx="16.2" cy="14.5" r="1.8"/><path d="M4 19h16"/><path d="M8 21.5h8"/></svg></button>
  <button type="button" id="dqOptimus" class="dq-btn" aria-label="行走"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.8" r="2.3"/><path d="M9.2 8.2h5.6v6H9.2z"/><path d="M9.2 10.2L6.8 13.5M14.8 10.2l2.4 3.3"/><path d="M10.4 14.2L8.6 19.5M13.6 14.2l1.8 5.3"/></svg></button>
  <button type="button" id="dqRaptor" class="dq-btn" aria-label="猛禽拆解"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l1.8 6.2 5.7 2.8-5.7 1.6-1.8 8.4-1.8-8.4-5.7-1.6 5.7-2.8z"/><path d="M4.5 4.5l1.6 1.6M19.5 4.5l-1.6 1.6M4.5 19.5l1.6-1.6M19.5 19.5l-1.6-1.6"/></svg></button>
  <button type="button" id="dqHoloLib" class="dq-btn" aria-label="3D 拆解库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
  <button type="button" id="dqEarth" class="dq-btn" aria-label="流浪地球"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><ellipse cx="12" cy="12" rx="10" ry="3.5" transform="rotate(-20 12 12)"/><circle cx="18.5" cy="6" r="1.2" fill="currentColor" stroke="none"/></svg></button>
  <button type="button" id="dqSkin" class="dq-btn" aria-label="换皮肤"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg></button>
</div>
<div class="vignette"></div>
<div class="haze" aria-hidden="true"></div><div class="shade l" aria-hidden="true"></div><div class="shade r" aria-hidden="true"></div>
<div class="labels" id="labels" aria-hidden="true"><svg id="link"><defs><linearGradient id="lk" x1="0" x2="1"><stop offset="0" stop-color="#7FDBFF" stop-opacity=".1"></stop><stop offset="1" stop-color="#7FDBFF" stop-opacity=".9"></stop></linearGradient></defs><path id="linkPath" fill="none" stroke="url(#lk)" stroke-width="1.2"></path></svg></div>
<div class="state-badge" id="badge" aria-hidden="true">LISTENING</div>

<div class="hud">
  <header class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2l10.4 6v12L14 26 3.6 20V8z" fill="#0b1a24" stroke="#DCEFF7" stroke-opacity=".7"></path><path d="M14 2v24M3.6 8l20.8 12M24.4 8L3.6 20" stroke="#DCEFF7" stroke-opacity=".55" stroke-width="1"></path><path d="M14 8.5l4.8 2.75v5.5L14 19.5l-4.8-2.75v-5.5z" fill="#DCEFF7" fill-opacity=".85"></path></svg>
      <b>J.A.R.V.I.S</b>
      <small>Personal<br>Local Agent</small>
    </div>
    <span class="sep"></span>
    <div class="clock"><b id="clock">--:--</b><span id="date"></span></div>
    <span class="sep"></span>
    <div class="motto"><span>随时待命，只为你一人</span><i></i></div>
    <span class="grow"></span>
    <div class="stats">
      <span>LOCAL<b class="on">● ON</b></span>
      <span>CPU<b id="cpu">--</b></span>
      <span>MEM<b id="mem">57%</b></span>
      <span>NET<b>⇅ <span id="net">6.1MB/s</span></b></span>
      <span id="batBox" hidden>BAT<b id="bat">--</b></span>
    </div>
    <span class="sep"></span>
    <div class="icons">
      <button class="icon-btn" type="button" aria-label="搜索指令" id="btnSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg></button>
      <button class="icon-btn" type="button" aria-label="开始说话" id="btnMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>
      <button class="icon-btn" type="button" aria-label="隐私：数据仅存本地" id="btnShield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"></path><path d="M12 8.5l3 1.75v3.5L12 15.5l-3-1.75v-3.5z"></path></svg></button>
      <div class="menu-wrap"><button class="icon-btn" type="button" aria-label="菜单" aria-expanded="false" id="btnMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h16"></path></svg></button>
        <div class="menu-pop" id="menuPop" hidden><button type="button" id="btnVoice" aria-pressed="true">语音播报<b>开</b></button></div></div>
    </div>
  </header>


</div>

<div id="statsHolo" hidden aria-live="polite" title="点击收起">
  <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
  <div class="sh-top"><span class="pip"></span>CREATOR REPORT · 作品数据<span class="when" id="shWhen"></span></div>
  <div class="sh-cap" id="shCap"></div>
  <div class="sh-hero">
    <div class="big"><b id="shPlays">0</b><span>播放量</span></div>
    <div class="fans"><b id="shFans">+0</b><span>涨粉</span></div>
    <div class="boost" id="shBoostBox"><b id="shBoost">0</b><span>平台扶持流量</span></div>
  </div>
  <div class="sh-grid" id="shGrid"></div>
  <div class="sh-bars" id="shBars"></div>
  <div class="sh-foot"><span>来源：桌面截图 · 本机识别</span><span id="shRatio"></span></div>
</div>
<script type="importmap">
{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
</script>
<script type="module" src="js/boot.js"></script>

</body></html>
