plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.kotlinAndroid)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.jarvis.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.app"
        // 第 95 批补丁（2026-11-28）：minSdk 24→26。litertlm-android 0.19.1 的
        // 字节码用了 invoke-customs，D8 在 minSdk 24 下拒绝 dex（"Invoke-customs
        // are only supported starting with Android O (--min-api 26)"，jk-v127 首建
        // 失败原因）。用户手机是 Android 16（API 36），升到 26 对他没影响。
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // jk-v65 瘦身：只打 arm64-v8a。魅族 20 Pro 是 arm64，
        // 其余三种 ABI（x86/x86_64/armeabi-v7a）的 .so 白占约 130MB。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 签名统一（jk-v39/jk-v58 教训）：Gradle 默认 debug 签名没用上 CI 恢复的
    // 共享 keystore（每台构建机现生成一把新钥匙，jk-v39 指纹 AC:1F:31:E9…、
    // jk-v58 指纹 5D:DC:6B…、共享钥匙 58:28:7C… 三者全不同，导致每次都要
    // 卸载重装）。这里显式指向恢复后的文件；文件不存在时保持 Gradle 默认行为。
    signingConfigs {
        sharedDebug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            def ksFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
            if (ksFile.exists()) {
                signingConfig signingConfigs.sharedDebug
            }
        }
        release {
            minifyEnabled false
        }
    }

    // NPU 档：QNN 的 .so 必须解压到 nativeLibraryDir，Backend.NPU(nativeLibraryDir)
    // 才能找到它们；默认不解压（直接从 APK 里 dlopen）时 NPU 初始化找不到库。
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // AGP 8 默认不生成 BuildConfig；HudActivity 靠它判断 debug 才开 WebView 调试，
    // 不开这里编译就报 Unresolved reference: BuildConfig（jk-v42 失败原因）。
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // 第 95 批补丁（2026-11-28）：litertlm-android 0.19.1 本身就是 Kotlin 2.4 编的，
        // 1.9 编译器读不了它的 metadata（jk-v127 第二建 kspDebugKotlin 失败）。
        // 这个 flag 只跳过版本检查，不跳过二进制兼容校验；litertlm 对外 API 只是
        // 数据类/函数/密封类，没有 2.x 新语法，1.9 编译器读得懂。升 Kotlin 工具链
        // 是另外一件事，不在这里动。
        freeCompilerArgs += "-Xskip-metadata-version-check"
    }
}

// NPU 档（第 95 批补丁，2026-11-28）：litertlm-android 0.19.1 拖进来 kotlin-stdlib /
// kotlin-reflect 2.4.0 与 kotlinx-coroutines 1.11.0，Kotlin 1.9 编译器读不了 2.x 的
// metadata（kspDebugKotlin 直接失败，jk-v127 首建失败原因之一）。本工程是 Kotlin
// 1.9.22 + coroutines 1.7.3，这里把这组传递依赖钉回工程已用的版本；litertlm 用到
// 的只是 Flow 与基础 stdlib，1.9.22/1.7.3 覆盖得了。升级 Kotlin 工具链是另外一
// 件事，不在这里动。残留风险：litertlm 内部若调了 2.4 才有的 stdlib 函数，运行时
// 才会在 NPU 初始化时报 NoSuchMethodError——真机上点设置里“试答”就能验出来。
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            ['kotlin-stdlib', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8', 'kotlin-reflect'].contains(details.requested.name)) {
            details.useVersion('1.9.22')
        }
        if (details.requested.group == 'org.jetbrains.kotlinx' &&
            ['kotlinx-coroutines-core', 'kotlinx-coroutines-core-jvm', 'kotlinx-coroutines-android'].contains(details.requested.name)) {
            details.useVersion('1.7.3')
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    // 全息 HUD（GDDXX-Jarvis 的 hud/，GPL-3.0，见 app/src/main/assets/hud/NOTICE.md）
    // 用 WebViewAssetLoader 把 assets/hud/ 以 https 域名形式交给 WebView，
    // 否则 file:// 下 ES 模块与 importmap 会被跨域拦截、页面跑不起来。
    implementation libs.androidx.webkit
    // 真液态玻璃第 1 批：QWEA0 Liquid-Glass-Android v2.0.11（MIT，JitPack 坐标，
    // 见 gradle/libs.versions.toml）。库本身只依赖 core-ktx（appcompat/material
    // 是 compileOnly，弹窗才用得到，本批不用，不会拖进来）。
    implementation libs.liquidglass
    // Agnes 对话(REST) 用的 HTTP 客户端。来源：Maven Central，com.squareup.okhttp3:okhttp 4.12.0。
    implementation libs.okhttp
    // 批三：长期记忆的 Room 持久化 + 协程（版本对应见 gradle/libs.versions.toml：
    // KSP 1.9.22-1.0.17 严格对应 Kotlin 1.9.22；Room 2.6.1；coroutines 1.7.3）。
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler
    implementation libs.kotlinx.coroutines.android
    // 批五：端侧小模型运行时（MediaPipe LLM Inference），与旧 Flutter 版 LocalLlmBridge 同一版本 0.10.24，
    // 只吃 .task 模型（用户自备导入，App 不内置不下载）；要求 minSdk 24，与本工程一致。
    implementation libs.mediapipe.tasks.genai
    // sherpa-onnx 1.12.23（流式 zipformer 离线识别）预编译 aar，官方只发 GitHub Releases，
    // 由 CI 构建时下载放到 app/libs/（不进 git），文件名必须完全一致。
    implementation files('libs/sherpa-onnx-1.12.23.aar')
    // Shizuku 13.1.5（2026-11-12 由 12.2.0 升上来）：13.x 里旧的直接跑进程入口已是
    // private（计划 API 14 移除），shell 改走 bindUserService + UserService（见
    // task/ShellUserService.kt + task/ShizukuHelper.kt）。手机上的 Shizuku 应用是
    // 13.6.0，12.2.0 的旧入口调用对它发不出去——这就是 jk-v74 真机上 shell
    // “命令没跑起来”的原因。
    // 来源：Maven Central，dev.rikka.shizuku:api / :provider，MIT 协议。
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    // NPU 档（2026-11-27）：LiteRT-LM 官方 Kotlin API + 高通 QNN 运行时。
    // litertlm-android 0.19.1（Fertroll10 的 SM8550 实测版）；qnn-runtime 2.52.0
    // （与 0.19.1 的 dispatch 配对的 QAIRT 版；dispatch 与 runtime 必须同代）。
    implementation libs.litertlm.android
    implementation libs.qnn.runtime
    // OCR 补字层（2026-11-05，Mika 同款）：ML Kit 文本识别 Bundled 版，中文 + 拉丁
    // 双识别器，模型静态打包进 APK（约 +8MB/ABI），离线、不用 Play Services，
    // 国行魅族可用。树不够用时才跑 OCR，把图里的字捞回成可点坐标。
    implementation libs.mlkit.text.recognition
    implementation libs.mlkit.text.recognition.chinese
}
