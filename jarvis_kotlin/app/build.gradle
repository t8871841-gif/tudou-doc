plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.kotlinAndroid)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.jarvis.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    // Agnes 对话(REST) 用的 HTTP 客户端。来源：Maven Central，com.squareup.okhttp3:okhttp 4.12.0。
    implementation libs.okhttp
    // 批三：长期记忆的 Room 持久化 + 协程（版本对应见 gradle/libs.versions.toml：
    // KSP 1.9.22-1.0.17 严格对应 Kotlin 1.9.22；Room 2.6.1；coroutines 1.7.3）。
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler
    implementation libs.kotlinx.coroutines.android
    // 批五：端侧小模型运行时（MediaPipe LLM Inference），与旧 Flutter 版 LocalLlmBridge 同一版本 0.10.24，
    // 只吃 .task 模型（用户自备导入，App 不内置不下载）；要求 minSdk 24，与本工程一致。
    implementation libs.mediapipe.tasks.genai
    // sherpa-onnx 1.12.23（流式 zipformer 离线识别）预编译 aar，官方只发 GitHub Releases，
    // 由 CI 构建时下载放到 app/libs/（不进 git），文件名必须完全一致。
    implementation files('libs/sherpa-onnx-1.12.23.aar')
}
