plugins {
    alias(libs.plugins.androidApplication)
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'com.jarvis.native'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.native"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    // 二期新增：Agnes 对话(REST) 与 Edge TTS(WebSocket) 共用的 HTTP/WS 客户端。
    // 来源：Maven Central，com.squareup.okhttp3:okhttp，版本 4.12.0（选最后一个仍支持 Java 8/无需 okio3 以上额外配置的稳定版）。
    implementation libs.okhttp
    // 唤醒词/离线识别正式方案是 sherpa-onnx（流式 zipformer），但其 Android AAR 不在
    // Maven Central/阿里云镜像里直接可解析——官方发布方式是从 GitHub Releases 下载预编译 aar
    // 放到 app/libs/ 下，再 implementation files('libs/sherpa-onnx.aar')。本次交付环境没有
    // 公网访问权限，无法下载验证，所以这行先留空：你们那边把 aar 放进 app/libs/ 后取消下面注释。
    // implementation files('libs/sherpa-onnx.aar')
}
