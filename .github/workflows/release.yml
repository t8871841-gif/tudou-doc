name: Build Release APK

# 2026-09-04：改为仅手动触发。此前与 build-apk.yml 同时监听 v* tag 会双重构建，
# 且本 workflow 产物带 -TAG 后缀、与 README 下载链接（原始文件名）不一致。
# 正式发版统一走 build-apk.yml；本文件保留作备用手动通道（Actions 页面 Run workflow）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 离线语音识别模型不提交进仓库（release tarball 约 500MB）。
      # 从 sherpa-onnx 官方 release 下载流式 zipformer 双语模型，
      # 只取 App 需要的 4 个文件 staging 到 assets/asr/（Jarvis 同款做法）。
      - name: Download sherpa-onnx ASR models
        run: |
          curl -sL -o asr-model.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
          mkdir -p asr-model assets/asr
          tar -xjf asr-model.tar.bz2 -C asr-model
          # Only the 4 files the app needs (the tarball also ships fp32
          # duplicates, test wavs and bpe files we must NOT bundle).
          find asr-model -name 'encoder-epoch-99-avg-1.int8.onnx' -exec cp {} assets/asr/ \;
          find asr-model -name 'decoder-epoch-99-avg-1.onnx' -exec cp {} assets/asr/ \;
          find asr-model -name 'joiner-epoch-99-avg-1.int8.onnx' -exec cp {} assets/asr/ \;
          find asr-model -name 'tokens.txt' -exec cp {} assets/asr/ \;
          ls -la assets/asr/
          test -f assets/asr/encoder-epoch-99-avg-1.int8.onnx && test -f assets/asr/decoder-epoch-99-avg-1.onnx && test -f assets/asr/joiner-epoch-99-avg-1.int8.onnx && test -f assets/asr/tokens.txt
          # Free the ~1.5GB tarball + extracted tree: the runner ran out
          # of disk on the last build at the final APK copy.
          rm -rf asr-model asr-model.tar.bz2
          df -h .

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: 'stable'
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore signing key (canonical = KEYSTORE_BASE64 secret)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks
          printf 'storeFile=../keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=PKCS12\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > key.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Precache
        run: flutter precache --android

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage artifacts with tag suffix
        run: |
          TAG=${GITHUB_REF_NAME}
          mkdir -p artifacts
          for f in build/app/outputs/flutter-apk/*.apk; do
            name=$(basename "$f" .apk)
            cp "$f" "artifacts/${name}-${TAG}.apk"
          done

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/*.apk"
          generateReleaseNotes: true
          token: ${{ github.token }}
