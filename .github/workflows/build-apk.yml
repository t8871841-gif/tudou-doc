# 自动构建并发布 APK 到 GitHub Release
#
# 触发方式：
#   1. 推送以 "v" 开头的 tag（如 v1.11.9）→ 自动构建并发布
#   2. 在 Actions 页面手动触发（workflow_dispatch）
#
# 产物：通用版 app-release.apk + 按 ABI 拆分的三架构包（arm64-v8a / armeabi-v7a / x86_64），
#       共 4 个安装包一同发布到与 tag 同名的 GitHub Release（README 下载区四链均有效）。
#
# 可选：配置仓库 Secrets 后可产出正式签名 APK（否则回退 debug 签名）：
#   KEYSTORE_BASE64      : base64 后的 .jks 签名文件
#   KEYSTORE_PASSWORD    : keystore 密码
#   KEY_ALIAS            : 别名
#   KEY_PASSWORD         : 密钥密码
#   生成示例：base64 -w0 your.keystore.jks
#
# 可选：配置 GITEE_TOKEN 后，本流程会在 GitHub Release 发布后自动同步到 Gitee
#       （推 tag/master + 建同名发行版 + 上传同样 4 个 APK，见 .github/scripts/gitee_release.py）

name: Build APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 供 softprops/action-gh-release 创建 Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  NDK_VERSION: '28.2.13676358'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 统一 debug 签名：Secret 缺失时跳过（走 runner 默认 debug key）；正式发版密钥
      #（KEYSTORE_BASE64）不受影响。共享 debug keystore 由 ANDROID_DEBUG_KEYSTORE_BASE64
      # Secret 恢复到 ~/.android/debug.keystore，Gradle/Flutter 默认 debug 签名即用它。
      - name: Restore shared debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            if [ ! -s ~/.android/debug.keystore ] || [ "$(wc -c < ~/.android/debug.keystore)" -lt 1000 ]; then
              echo "Shared debug keystore looks invalid, falling back to runner default signing"
              rm -f ~/.android/debug.keystore
            fi
          fi
      # 离线语音识别模型不提交进仓库（release tarball 约 500MB）。
      # 从 sherpa-onnx 官方 release 下载流式 zipformer 双语模型，
      # 只取 App 需要的 4 个文件 staging 到 assets/asr/（Jarvis 同款做法）。
      - name: Download sherpa-onnx ASR models
        run: |
          curl -sL -o asr-model.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
          mkdir -p asr-model assets/asr
          tar -xjf asr-model.tar.bz2 -C asr-model
          # Only the 4 files the app needs (the tarball also ships fp32
          # duplicates, test wavs and bpe files we must NOT bundle).
          find asr-model -name 'encoder-epoch-99-avg-1.int8.onnx' -exec cp {} assets/asr/ \;
          find asr-model -name 'decoder-epoch-99-avg-1.onnx' -exec cp {} assets/asr/ \;
          find asr-model -name 'joiner-epoch-99-avg-1.int8.onnx' -exec cp {} assets/asr/ \;
          find asr-model -name 'tokens.txt' -exec cp {} assets/asr/ \;
          ls -la assets/asr/
          test -f assets/asr/encoder-epoch-99-avg-1.int8.onnx && test -f assets/asr/decoder-epoch-99-avg-1.onnx && test -f assets/asr/joiner-epoch-99-avg-1.int8.onnx && test -f assets/asr/tokens.txt
          # Free the ~1.5GB tarball + extracted tree: the runner ran out
          # of disk on the last build at the final APK copy.
          rm -rf asr-model asr-model.tar.bz2
          df -h .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          echo "y" | "$SDKMGR" "ndk;${{ env.NDK_VERSION }}"

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
            # 注意：build.gradle.kts 中 storeFile 以 android/app/ 为基准解析，
            # 故此处必须写 ../keystore.jks（与本地 ../release-key.jks 同构）。
            cat > android/key.properties <<EOF
          storeFile=../keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "已写入签名配置（密钥内容不回显）"
            ls -l android/keystore.jks
            echo "key.properties 字段数：$(grep -c '=' android/key.properties)"
          else
            echo "未配置签名 Secrets，本次回退 debug 签名"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Tune Gradle heap for CI
        run: |
          # 仓库的 android/gradle.properties 是为本机 OOM 环境（pagefile ~800MB）调的：
          # 1GB 堆 + 串行 GC + 关守护进程。在 CI（~7GB 内存）上会让 R8 混淆慢 10~30 倍。
          # 此处只覆盖 CI 检出的副本，不影响你本地构建。
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError|' android/gradle.properties
          sed -i 's|^org.gradle.daemon=.*|org.gradle.daemon=true|' android/gradle.properties
          echo "--- android/gradle.properties (CI override) ---"
          grep -E "org.gradle.jvmargs|org.gradle.daemon" android/gradle.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (universal)
        run: flutter build apk --release

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      # 把 4 个包的 SHA-256 追加进 Release 正文。App 内更新按「资产名 → 哈希」校验
      # 下载到的包，这是走第三方镜像 / 代理时唯一的密码学防线。格式：每行 `<hex>  <文件名>`。
      - name: Append APK SHA-256 to release body
        run: |
          SRC="release_notes/${{ github.ref_name }}.md"
          OUT="release_notes/${{ github.ref_name }}.body.md"
          cp "$SRC" "$OUT"
          {
            printf '\n---\n\n## 安装包 SHA-256（供 App 内更新校验）\n\n```\n'
            for f in build/app/outputs/flutter-apk/*.apk; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
            done
            printf '```\n'
          } >> "$OUT"
          echo '--- 已追加的校验段 ---'
          tail -n 8 "$OUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # 与 tag 同名的 release note；上一步已把 SHA-256 校验段追加进 .body.md
          body_path: release_notes/${{ github.ref_name }}.body.md
          fail_on_unmatched_files: false
          files: |
            build/app/outputs/flutter-apk/*.apk

      # 同步到 Gitee：推 tag/master + 建或更新同名发行版 + 上传同样 4 个 APK。
      # 未配置 GITEE_TOKEN 时脚本自行跳过（不会让本次 release 变红）。
      # 配置：Gitee 私人令牌（勾 projects）→ GitHub 仓库 Settings → Secrets → 新建 GITEE_TOKEN
      - name: Mirror tag & release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 .github/scripts/gitee_release.py
