name: Build Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Offline ASR models are NOT committed to the repo (the release
      # tarball is ~500MB). Download the sherpa-onnx streaming
      # zipformer bilingual model from the official release and
      # stage the 4 files the app expects under assets/asr/.
      - name: Download sherpa-onnx ASR models
        run: |
          curl -sL -o asr-model.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
          mkdir -p asr-model jarvis_app/assets/asr
          tar -xjf asr-model.tar.bz2 -C asr-model
          # Only the 4 files the app needs (the tarball also ships fp32
          # duplicates, test wavs and bpe files we must NOT bundle).
          find asr-model -name 'encoder-epoch-99-avg-1.int8.onnx' -exec cp {} jarvis_app/assets/asr/ \;
          find asr-model -name 'decoder-epoch-99-avg-1.onnx' -exec cp {} jarvis_app/assets/asr/ \;
          find asr-model -name 'joiner-epoch-99-avg-1.int8.onnx' -exec cp {} jarvis_app/assets/asr/ \;
          find asr-model -name 'tokens.txt' -exec cp {} jarvis_app/assets/asr/ \;
          ls -la jarvis_app/assets/asr/
          test -f jarvis_app/assets/asr/encoder-epoch-99-avg-1.int8.onnx && test -f jarvis_app/assets/asr/decoder-epoch-99-avg-1.onnx && test -f jarvis_app/assets/asr/joiner-epoch-99-avg-1.int8.onnx && test -f jarvis_app/assets/asr/tokens.txt
          # Free the ~1.5GB tarball + extracted tree: the runner ran out
          # of disk on the last build at the final APK copy.
          rm -rf asr-model asr-model.tar.bz2
          df -h .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Remove stale local.properties
        run: rm -f jarvis_app/android/local.properties

      - name: Flutter pub get
        run: cd jarvis_app && flutter pub get

      # Hanfang-proven CI tuning: daemon ON, 4G + G1GC, no --verbose,
      # no workers=1 / aapt2-daemon=false overrides. Local gradle.properties
      # is left alone except for the memory bump below.
      - name: Boost Gradle memory (Hanfang style)
        run: |
          cd jarvis_app/android
          sed -i 's/-Xmx1024M/-Xmx4g/' gradle.properties || true
          sed -i 's/-Xmx1536M/-Xmx4g/' gradle.properties || true
          grep -q 'MaxMetaspaceSize=1g' gradle.properties || sed -i 's/-XX:MaxMetaspaceSize=[0-9a-zA-Z]* /-XX:MaxMetaspaceSize=1g /' gradle.properties || true
          grep -q 'UseG1GC' gradle.properties || sed -i 's/org.gradle.jvmargs=/org.gradle.jvmargs=-XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError /' gradle.properties || true
          sed -i 's/^org.gradle.daemon=.*/org.gradle.daemon=true/' gradle.properties || echo 'org.gradle.daemon=true' >> gradle.properties
          grep -q '^org.gradle.daemon=' gradle.properties || echo 'org.gradle.daemon=true' >> gradle.properties
          cat gradle.properties

      # #37: --split-per-abi 只出 arm64-v8a 一个包（另两个架构的原生库不再打包，约 47.7MB 瘦身）。拆分后产物名为 app-arm64-v8a-release.apk，不再是 app-release.apk。
      - name: Build APK
        timeout-minutes: 60
        run: cd jarvis_app && flutter build apk --release --target-platform android-arm64 --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
