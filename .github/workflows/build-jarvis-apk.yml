name: Build Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Remove stale local.properties
        run: rm -f jarvis_app/android/local.properties

      - name: Reassemble Kokoro model assets
        run: bash jarvis_app/kokoro-parts/reassemble.sh

      - name: Flutter pub get
        run: cd jarvis_app && flutter pub get

      # Hanfang-proven CI tuning: daemon ON, 4G + G1GC, no --verbose,
      # no workers=1 / aapt2-daemon=false overrides. Local gradle.properties
      # is left alone except for the memory bump below.
      - name: Boost Gradle memory (Hanfang style)
        run: |
          cd jarvis_app/android
          sed -i 's/-Xmx1024M/-Xmx4g/' gradle.properties || true
          sed -i 's/-Xmx1536M/-Xmx4g/' gradle.properties || true
          grep -q 'MaxMetaspaceSize=1g' gradle.properties || sed -i 's/-XX:MaxMetaspaceSize=[0-9a-zA-Z]* /-XX:MaxMetaspaceSize=1g /' gradle.properties || true
          grep -q 'UseG1GC' gradle.properties || sed -i 's/org.gradle.jvmargs=/org.gradle.jvmargs=-XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError /' gradle.properties || true
          sed -i 's/^org.gradle.daemon=.*/org.gradle.daemon=true/' gradle.properties || echo 'org.gradle.daemon=true' >> gradle.properties
          grep -q '^org.gradle.daemon=' gradle.properties || echo 'org.gradle.daemon=true' >> gradle.properties
          cat gradle.properties

      - name: Build APK
        timeout-minutes: 60
        run: cd jarvis_app && flutter build apk --release --target-platform android-arm64

      - name: Verify Kokoro assets in APK
        run: |
          unzip -l jarvis_app/build/app/outputs/flutter-apk/app-release.apk | grep -q 'assets/kokoro/espeak-ng-data/' || (echo 'MISSING espeak-ng-data in APK' && exit 1)
          unzip -l jarvis_app/build/app/outputs/flutter-apk/app-release.apk | grep -q 'assets/kokoro/dict/' || (echo 'MISSING dict in APK' && exit 1)
          unzip -l jarvis_app/build/app/outputs/flutter-apk/app-release.apk | grep -q 'assets/kokoro/model.int8.onnx' || (echo 'MISSING model in APK' && exit 1)
          echo 'Kokoro assets verified in APK.'

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
