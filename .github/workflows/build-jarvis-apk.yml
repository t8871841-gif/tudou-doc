name: Build Jarvis APK


on:
  workflow_dispatch:


permissions:
  contents: read


env:
  FLUTTER_VERSION: '3.47.0'


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Remove stale local.properties
        run: rm -f jarvis_app/android/local.properties
      - run: cd jarvis_app && flutter pub get
      - name: Boost Gradle memory
        run: |
          sed -i 's/-Xmx1024M/-Xmx4g/; s/org.gradle.workers.max=1/org.gradle.workers.max=4/' jarvis_app/android/gradle.properties
          echo "org.gradle.daemon=false" >> jarvis_app/android/gradle.properties
      - run: cd jarvis_app && flutter build apk --release --target-platform android-arm64 --verbose
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis_app/build/app/outputs/flutter-apk/app-release.apk
