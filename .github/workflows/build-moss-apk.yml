name: Build Moss APK

on:
  push:
    tags:
      - 'moss-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moss
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Offline recognition binaries: the sherpa-onnx aar and the zipformer
      # model files are binaries and never enter git. They are fetched here
      # from the upstream GitHub releases, and the build fails loudly if any
      # of them is missing — shipping a build without the model would mean
      # turns that fail with "offline recognition unavailable" and no
      # explanation. Retried downloads: the release host cuts long transfers,
      # so curl resumes until the file is whole.
      - name: Fetch sherpa-onnx AAR and offline model
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p moss/app/libs moss/app/src/main/assets/asr
          AAR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.23/sherpa-onnx-1.12.23.aar"
          for i in 1 2 3 4 5 6; do
            curl -sL -C - --max-time 600 -o moss/app/libs/sherpa-onnx-1.12.23.aar "$AAR_URL" && break
            sleep 5
          done
          test -s moss/app/libs/sherpa-onnx-1.12.23.aar
          MODEL_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2"
          for i in 1 2 3 4 5 6; do
            curl -sL -C - --max-time 600 -o /tmp/sherpa-model.tar.bz2 "$MODEL_URL" && break
            sleep 5
          done
          mkdir -p /tmp/sherpa-model
          tar -xjf /tmp/sherpa-model.tar.bz2 --wildcards -C /tmp/sherpa-model \
            '*/encoder-epoch-99-avg-1.int8.onnx' \
            '*/decoder-epoch-99-avg-1.onnx' \
            '*/joiner-epoch-99-avg-1.int8.onnx' \
            '*/tokens.txt'
          for f in encoder-epoch-99-avg-1.int8.onnx decoder-epoch-99-avg-1.onnx joiner-epoch-99-avg-1.int8.onnx tokens.txt; do
            src=$(find /tmp/sherpa-model -name "$f" | head -1)
            test -n "$src" && test -s "$src" && cp "$src" moss/app/src/main/assets/asr/
          done
          ls -la moss/app/libs moss/app/src/main/assets/asr

      - name: Install Android SDK platform 34
        working-directory: ${{ github.workspace }}
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-moss-${{ hashFiles('moss/**/*.gradle', 'moss/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-moss-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -Djava.net.preferIPv4Stack=true --stacktrace

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: moss-apk-${{ github.run_number }}
          name: Moss APK ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
