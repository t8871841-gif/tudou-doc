name: Build Jarvis Kotlin APK

on:
  push:
    tags:
      - 'jk-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis_kotlin
    steps:
      - uses: actions/checkout@v4

      # 统一 debug 签名：Secret 缺失时跳过（走 runner 默认 debug key）；正式发版密钥
      #（KEYSTORE_BASE64）不受影响。共享 debug keystore 由 ANDROID_DEBUG_KEYSTORE_BASE64
      # Secret 恢复到 ~/.android/debug.keystore，Gradle/Flutter 默认 debug 签名即用它。
      - name: Restore shared debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            if [ ! -s ~/.android/debug.keystore ] || [ "$(wc -c < ~/.android/debug.keystore)" -lt 1000 ]; then
              echo "Shared debug keystore looks invalid, falling back to runner default signing"
              rm -f ~/.android/debug.keystore
            fi
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify restored keystore fingerprint
        # 共享 keystore 的 SHA-256 指纹以 58:28:7C:0C:45:F6:F1:48 开头（本地备份
        # ~/workspace/signing/debug.keystore 实测）。指纹不对说明 Secret 里
        # 的值不是共享钥匙，直接失败，不让错签的包流到发布。
        run: |
          FP=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -i "SHA256" | head -1 | tr -d ':' | tr 'a-f' 'A-F')
          echo "Restored keystore fingerprint: $FP"
          case "$FP" in
            *58287C0C45F6F148*) echo "Keystore fingerprint OK (shared key)";;
            *) echo "::error::Restored keystore fingerprint does NOT match the shared key (expected 58:28:7C...). Check the ANDROID_DEBUG_KEYSTORE_BASE64 secret."; exit 1;;
          esac

      - name: Install Android SDK platform 34
        working-directory: ${{ github.workspace }}
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jk-${{ hashFiles('jarvis_kotlin/**/*.gradle', 'jarvis_kotlin/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jk-

      - name: Download sherpa-onnx AAR + offline ASR models
        run: |
          mkdir -p app/libs app/src/main/assets/asr /tmp/asr-model
          curl -sL -o app/libs/sherpa-onnx-1.12.23.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.23/sherpa-onnx-1.12.23.aar
          curl -sL -o /tmp/asr-model.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
          tar -xjf /tmp/asr-model.tar.bz2 -C /tmp/asr-model
          find /tmp/asr-model -name 'encoder-epoch-99-avg-1.int8.onnx' -exec cp {} app/src/main/assets/asr/ \;
          find /tmp/asr-model -name 'decoder-epoch-99-avg-1.onnx' -exec cp {} app/src/main/assets/asr/ \;
          find /tmp/asr-model -name 'joiner-epoch-99-avg-1.int8.onnx' -exec cp {} app/src/main/assets/asr/ \;
          find /tmp/asr-model -name 'tokens.txt' -exec cp {} app/src/main/assets/asr/ \;
          ls -la app/libs/ app/src/main/assets/asr/
          test -f app/libs/sherpa-onnx-1.12.23.aar
          test -f app/src/main/assets/asr/encoder-epoch-99-avg-1.int8.onnx
          test -f app/src/main/assets/asr/decoder-epoch-99-avg-1.onnx
          test -f app/src/main/assets/asr/joiner-epoch-99-avg-1.int8.onnx
          test -f app/src/main/assets/asr/tokens.txt
          rm -rf /tmp/asr-model /tmp/asr-model.tar.bz2

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -Djava.net.preferIPv4Stack=true --stacktrace

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Verify APK signature fingerprint
        # 构建出的 APK 必须由共享 keystore（58:28:7C…）签名，否则装机时仍要
        # 卸载重装。指纹不对直接失败，不发布错签的包。
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK/build-tools/34.0.0/apksigner" verify --print-certs --verbose out/*.apk 2>&1 | tee /tmp/apkcerts.txt
          if grep -qi "58287c0c45f6f148" /tmp/apkcerts.txt; then
            echo "APK signature fingerprint OK (shared key)"
          else
            echo "::error::APK was NOT signed with the shared key (expected 58:28:7C...). Check the signingConfig and the ANDROID_DEBUG_KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-kotlin-apk-${{ github.run_number }}
          name: Jarvis Kotlin APK ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
