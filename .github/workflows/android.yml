name: android
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      # AZJ: full flavour needs the MNN prebuilt, whose upstream release asset is gone (404);
      # build the lite flavour (GGUF + cloud model) and skip the MNN download.
      - run: sh scripts/fetch-deps.sh --skip-mnn
      # AZJ: host native tests skipped (needs a model download + host native build); unit tests + lint + APK build run below.
      - run: ./gradlew --no-daemon testLiteDebugUnitTest lintLiteDebug assembleLiteDebug
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: app/build/outputs/apk/lite/debug/*.apk }