name: jarvis_app
description: "Jarvis - cinematic HUD voice assistant. Original vector HUD, LLM chat, Edge neural voice."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  sherpa_onnx: ^1.13.8
  audioplayers: ^6.1.0
  crypto: ^3.0.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.0
  android_intent_plus: ^5.0.2
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/kokoro/
    - assets/kokoro/dict/
    - assets/kokoro/dict/pos_dict/
